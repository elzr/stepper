<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Screenmaps</title>
  <!-- fleet F040/light-dark-mode: light by day, dark by night over Guadalajara, or the sun/moon toggle
       in the header; sets <html data-theme> before the first paint -->
  <script src="https://fleet.internal/features/F040-tiptop-software-infrastructure/subfeatures/light-dark-mode/theme.js"></script>
  <link rel="stylesheet" href="screenmaps.css">
</head>
<body>
  <header class="page-header">
    <h1><span id="heading">Screenmaps</span> <span class="taken" id="asOf"></span></h1>
    <nav class="configs" id="configs" aria-label="Display configs"></nav>
  </header>
  <p class="subtitle" id="summary"></p>

  <section class="nav-panel" id="panel">
    <div class="panel-head">
      <div class="panel-views" role="tablist">
        <button type="button" data-view="map" title="Map (m)">Map</button>
        <button type="button" data-view="days" title="Days (d)">Days</button>
      </div>
      <div class="map-modes" id="presets">
        <button type="button" data-preset="flat" title="Face on, a flat map (1)">Flat</button>
        <button type="button" data-preset="turned" title="The displays upright, turned so their right edges are the farther ones, seen a little from above (2)">Turned</button>
        <button type="button" data-preset="ground" title="The displays lying flat as on a floor (3)">On the ground</button>
      </div>
      <div class="map-modes" id="stack">
        <button type="button" data-stack="above" title="Windows stacked up from their display, the front one nearest you (s switches)">Above</button>
        <button type="button" data-stack="below" title="Windows sunk into their display, each a see-through hole as deep as its windows (s switches)">Below</button>
      </div>
      <span class="panel-hint" id="mapHint"></span>
      <div class="app-filters" id="apps" aria-label="Only one app's windows"></div>
    </div>
    <div class="screen-map" id="map"></div>
    <div class="days" id="days"></div>
  </section>

  <div class="filter-banner" id="banner" hidden></div>
  <section class="screen-lists" id="list"></section>

  <div class="map-pop" id="pop" hidden></div>
  <script src="screenmaps.js"></script>
</body>
</html>
